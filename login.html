<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 / 注册 · Speak & Write IELTS</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fffdf9;color:#20203a;font-family:'DM Sans','Noto Sans SC',sans-serif;display:grid;place-items:center;padding:22px}.panel{width:min(100%,450px);background:white;border:1px solid #eeeaf5;border-radius:24px;padding:34px;box-shadow:0 20px 60px #30205312}.brand{font-size:18px;font-weight:900;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;background:#7955ff;color:white;border-radius:11px;box-shadow:3px 3px #d6ff55;margin-right:9px}.tabs{display:flex;gap:8px;background:#f4f1fa;border-radius:12px;padding:5px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:9px;font-weight:700;color:#77758c;cursor:pointer}.tabs button.active{background:white;color:#7955ff;box-shadow:0 2px 8px #20203a10}h1{font-size:25px;margin:24px 0 6px}p{font-size:13px;color:#77758c;margin:0 0 21px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #e8e4ef;border-radius:10px;font:inherit;outline-color:#7955ff}.submit{width:100%;border:0;background:#7955ff;color:white;border-radius:11px;padding:14px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 5px 0 #5838d0;margin-top:10px}.msg{min-height:20px;color:#e14c91;font-size:12px;margin-top:13px}.back{display:block;text-align:center;color:#7955ff;font-size:12px;font-weight:700;margin-top:16px}small{display:block;color:#8d899e;font-size:10px;margin-top:14px;line-height:1.6}
</style></head><body><main class="panel"><div class="brand"><span class="mark">IEL</span>Speak & Write</div><div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">创建账号</button></div><h1 id="title">欢迎回来 👋</h1><p id="subtitle">登录后继续你的 IELTS 学习计划。</p><form id="form"><div class="field" id="nameField" hidden><label for="name">称呼</label><input id="name" autocomplete="name" maxlength="40"></div><div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">密码（至少 8 位）</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button class="submit" id="submit">登录</button></form><div class="msg" id="msg" role="status"></div><a class="back" href="/">← 返回首页</a><small>本地原型：账号保存在此设备的 SQLite 数据库中。</small></main><script>
let mode='login';const $=id=>document.getElementById(id);const redirectAfterAuth=()=>{const n=new URLSearchParams(location.search).get('next');return n&&n.startsWith('/')&&!n.startsWith('//')?n:'/dashboard.html'};function setMode(next){mode=next;const reg=mode==='register';$('loginTab').classList.toggle('active',!reg);$('registerTab').classList.toggle('active',reg);$('nameField').hidden=!reg;$('title').textContent=reg?'创建你的学习账号 ✨':'欢迎回来 👋';$('subtitle').textContent=reg?'保存练习进度与收藏话题。':'登录后继续你的 IELTS 学习计划。';$('submit').textContent=reg?'创建账号':'登录';$('password').autocomplete=reg?'new-password':'current-password';$('msg').textContent=''}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='处理中…';try{const r=await fetch('/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');location.href=redirectAfterAuth()}catch(err){$('msg').textContent=err.message}};
</script></body></html>
